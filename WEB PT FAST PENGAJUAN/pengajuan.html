<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengajuan pt fast</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* BACKGROUND */
        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    #292929 0%,
                    #080808 45%,
                    #000 100%
                );
            z-index: -2;
        }

        /* CAHAYA MERAH */
        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(255, 0, 0, 0.12);
            border-radius: 50%;
            filter: blur(80px);
            animation: glowMove 4s infinite alternate;
            z-index: -1;
        }

        @keyframes glowMove {
            from {
                transform: scale(0.8);
                opacity: 0.4;
            }

            to {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* KOTAK UTAMA */
        .prank-box {
            width: 430px;
            max-width: 90%;
            padding: 15px;
            text-align: center;

            background: rgba(15, 15, 15, 0.92);

            border: 2px solid red;
            border-radius: 15px;

            box-shadow:
                0 0 15px rgba(255, 0, 0, 0.5),
                0 0 40px rgba(255, 0, 0, 0.2);

            animation: boxAppear 0.8s ease;
        }

        @keyframes boxAppear {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* JUDUL */
        h1 {
            color: red;

            font-size: 55px;

            font-weight: 900;

            letter-spacing: 5px;

            line-height: 1;

            margin-bottom: 5px;

            text-shadow:
                0 0 5px white,
                0 0 10px red,
                0 0 25px red;

            animation: titleBlink 1.2s infinite alternate;
        }

        @keyframes titleBlink {
            from {
                opacity: 0.75;
            }

            to {
                opacity: 1;
            }
        }

        /* SUBTITLE */
        .subtitle {
            color: white;

            margin-bottom: 12px;

            font-size: 13px;

            letter-spacing: 2px;
        }

        /* FOTO */
        .photo-container {
            position: relative;

            width: 100%;

            max-width: 360px;

            margin: auto;

            border-radius: 12px;

            overflow: hidden;

            border: 2px solid white;

            box-shadow:
                0 0 8px white,
                0 0 20px red;
        }

        .photo-container img {
            width: 100%;

            height: auto;

            display: block;
        }

        /* TULISAN DI FOTO */
        .photo-text {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 10px 5px;

            color: white;

            font-size: 21px;

            font-weight: bold;

            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.9)
            );

            text-shadow:
                0 0 5px red,
                0 0 10px red;
        }

        /* BUTTON */
        button {
            margin-top: 15px;

            padding: 10px 25px;

            border: none;

            border-radius: 50px;

            background: red;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 15px red;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);

            background: #ff3333;

            box-shadow:
                0 0 15px red,
                0 0 30px red;
        }

        /* PESAN */
        #message {
            margin-top: 12px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            display: none;

            animation: shake 0.4s infinite;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-4px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* HP */
        @media (max-width: 600px) {

            .prank-box {
                width: 340px;
                padding: 12px;
            }

            h1 {
                font-size: 45px;
            }

            .subtitle {
                font-size: 11px;
            }

            .photo-container {
                max-width: 290px;
            }

            .photo-text {
                font-size: 17px;
            }

            button {
                font-size: 13px;
                padding: 9px 20px;
            }

            #message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="glow"></div>


    <!-- KOTAK PRANK -->
    <div class="prank-box">

        <h1>Pengajuan PT FAST</h1>

        <div class="subtitle">
            Silakan ajukan pengajuan Anda
        </div>


        <!-- FOTO MONYET -->
        <div class="photo-container">

            <img
                src="monyet.jpg"
                alt="Prank"
            >

            <div class="photo-text">
                😈 KENA PRANK KAISAR BALIK AOWKOAOWKO BRO 😈
            </div>

        </div>


        <!-- BUTTON -->
        <button onclick="prank()">
            JANGAN DIKLIK 😈
        </button>


        <!-- PESAN SETELAH KLIK -->
        <div id="message">
            WKWKWK 😂😂😂
            <br>
            KENA PRANK LAGI!
        </div>

    </div>


    <script>

        function prank() {

            const message =
                document.getElementById("message");

            message.style.display = "block";


            /* EFEK GETAR */
            document.body.animate(
                [
                    {
                        transform: "translate(0, 0)"
                    },

                    {
                        transform: "translate(-8px, 4px)"
                    },

                    {
                        transform: "translate(8px, -4px)"
                    },

                    {
                        transform: "translate(-8px, -4px)"
                    },

                    {
                        transform: "translate(8px, 4px)"
                    },

                    {
                        transform: "translate(0, 0)"
                    }
                ],
                {
                    duration: 500
                }
            );

        }

    </script>

</body>
</html>
